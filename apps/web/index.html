<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymind: one question, every AI model</title>
    <meta name="description" content="Ask once and compare answers from hundreds of AI models side by side." />
    <meta name="theme-color" content="#3340e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      try {
        var saved = JSON.parse(localStorage.getItem("polymind") || "{}").state || {};
        var theme = saved.theme || "system";
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
